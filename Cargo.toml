[package]
name = "pi_arr"
version = "0.31.0"
authors = ["zmax <zmax@gaia.world>"]
edition = "2021"
description = "lock-free & auto-expansion array"
repository = "https://github.com/GaiaWorld/pi_arr.git"
license = "MIT OR Apache-2.0"
keywords = ["pi", "array", "pi_arr"]

[dependencies]
pi_share = "0.6"
pi_vec_remain = { version = "0.2", path = "../pi_vec_remain" }
pi_buckets = { version = "0.3.1", path = "../pi_buckets" }

[features]
rc = ["pi_share/rc"]

[dev-dependencies]
rand = "0.8"
pcg_rand = "0.13"
